# ===== Database Configuration (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=123456a@
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===== Branch Information =====
app.branch-name=Nha Thuoc So 1
app.hotline=1900xxxx

# ===== VAT Rate (có th? thay ??i ??ng) =====
pharmacy.vat-rate=0.10

# ===== Warehouse Service =====
warehouse.service.url=http://localhost:8081

# ===== Resilience4j Circuit Breaker =====
resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.warehouseCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouseCB.permitted-number-of-calls-in-half-open-state=3

# Không ném exception ra ngoài khi fallback đã xử lý
resilience4j.circuitbreaker.instances.warehouseCB.record-exceptions=java.lang.Exception

# ===== Retry Configuration cho Electronic Invoice =====
# Số lần thử lại tối đa (tổng cộng 3 lần thử)
resilience4j.retry.instances.einvoiceRetry.max-attempts=3
# Thời gian chờ giữa các lần thử lại (2 giây)
resilience4j.retry.instances.einvoiceRetry.wait-duration=2s
# Chỉ thử lại khi gặp các lỗi liên quan đến kết nối mạng
resilience4j.retry.instances.einvoiceRetry.retry-exceptions=java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

# ===== Rate Limiter Configuration =====
# Giới hạn: 5 hóa đơn trong 10 giây cho mỗi máy khách
resilience4j.ratelimiter.instances.einvoiceRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.einvoiceRateLimiter.limit-refresh-period=10s
# Chờ tối đa 0 giây (fail-fast nếu vượt quá giới hạn)
resilience4j.ratelimiter.instances.einvoiceRateLimiter.timeout-duration=0s
